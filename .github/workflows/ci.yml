# This is the configuration file for our CI via Github Actions.
#
# The result of all executions of the Github Actions is logged in the "Actions" tab at the top of
# the repository. If the jobs aren't running as they should, check there to see if you didn't
# introduce a syntax error in the YAML file or something like that.
#
# Useful reference:
#   - https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions
#   - https://github.com/actions/checkout

name: Github Actions CI

# Github Actions can be infuriatingly obtuse at times. I don't know exactly why we need both the
# push and the pull_request events. It's wasteful, but at least does what we want.
#
# - only push:         doesn't run checks if an external fork opens a pull request
# - only pull_request: doesn't work with caching
# - both events:       runs the same checks twice, wasting compute time
on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

env:
    LUA_VERSION: 5.4.7
    LUAROCKS_VERSION: 3.9.0

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install Lua
              run: |
                  wget -O - https://www.lua.org/ftp/lua-${{env.LUA_VERSION}}.tar.gz | tar xzf -
                  cd lua-${{env.LUA_VERSION}}
                  make -j$(nproc) linux
                  sudo make install

            - name: Install Luarocks
              run: |
                  wget -O - https://luarocks.org/releases/luarocks-${{env.LUAROCKS_VERSION}}.tar.gz | tar xzf -
                  cd luarocks-${{env.LUAROCKS_VERSION}}
                  ./configure --with-lua=/usr/local
                  make -j$(nproc)
                  sudo make install

            - name: Install Luacheck
              run: luarocks install --local luacheck

            - name: Run Luacheck
              run: |
                  eval "$(luarocks path)"
                  ./run-lint

    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@v2

            # Lua's macosx target links -lreadline. Apple no longer ships it;
            # Homebrew's keg is not on the default include/lib path.
            - name: Install readline (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew install readline
                  echo "C_INCLUDE_PATH=$(brew --prefix readline)/include" >> "$GITHUB_ENV"
                  echo "LIBRARY_PATH=$(brew --prefix readline)/lib" >> "$GITHUB_ENV"

            - name: Install Lua
              run: |
                  curl -fsSL https://www.lua.org/ftp/lua-${{env.LUA_VERSION}}.tar.gz | tar xzf -
                  cd lua-${{env.LUA_VERSION}}
                  if [ "${{ runner.os }}" = macOS ]; then
                      plat=macosx
                  else
                      plat=linux
                  fi
                  make -j"$(getconf _NPROCESSORS_ONLN)" "$plat"
                  sudo make install

            - name: Build Pallene
              run: |
                  ./configure
                  make -j"$(getconf _NPROCESSORS_ONLN)"

            - name: Install Pallene
              run: sudo make install

            - name: Install Luarocks
              run: |
                  curl -fsSL https://luarocks.org/releases/luarocks-${{env.LUAROCKS_VERSION}}.tar.gz | tar xzf -
                  cd luarocks-${{env.LUAROCKS_VERSION}}
                  ./configure --with-lua=/usr/local
                  make -j"$(getconf _NPROCESSORS_ONLN)"
                  sudo make install

            - name: Install Busted
              run: luarocks --local install busted

            - name: Run Tests
              run: |
                  eval "$(luarocks path)"
                  busted -o gtest -v ./spec
